<!DOCTYPE html>
<html>

<head>
    <title>SOZENS AI</title>

    <style>

        body{
            font-family:Arial;
            background:#111827;
            color:white;
            text-align:center;
            padding:40px;
        }

        button{
            padding:12px 25px;
            font-size:18px;
            background:#16a34a;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        .card{
            margin:auto;
            margin-top:30px;
            width:420px;
            background:#1f2937;
            padding:25px;
            border-radius:15px;
            text-align:left;
            box-shadow:0 0 20px rgba(0,0,0,.4);
        }

        h2{
            color:#22c55e;
        }

        p{
            font-size:18px;
        }

    </style>

</head>

<body>

<h1>🤖 SOZENS AI</h1>

<button onclick="loadAnalysis()">
Analyze Market
</button>

<div id="result"></div>

<script>

async function loadAnalysis(){

    const response = await fetch("http://127.0.0.1:8000/analysis");

    const data = await response.json();

    document.getElementById("result").innerHTML = `

        <div class="card">

            <h2>${data.signal}</h2>

            <p><b>Pair:</b> ${data.pair}</p>

            <p><b>Price:</b> ${data.price}</p>

            <p><b>Trend:</b> ${data.trend}</p>

            <p><b>Confidence:</b> ${data.confidence}</p>

            <p><b>Entry:</b> ${data.entry}</p>

            <p><b>Stop Loss:</b> ${data.stop_loss}</p>

            <p><b>Take Profit:</b> ${data.take_profit}</p>

            <p><b>Risk Reward:</b> ${data.risk_reward}</p>

            <p><b>Reason:</b> ${data.reason}</p>

        </div>

    `;

}

</script>

</body>

</html>
